[project]
name = "padwan-ai"
version = "0.19.0"
description = "Lightweight async client for OpenAI, Gemini, Mistral, Grok, Anthropic, Voyage, ElevenLabs (experimental), Gradium (experimental), TypeSafe (experimental) and any OpenAI-compatible API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "julien.brayere@polarsen.io" }
]
requires-python = ">=3.13"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "niquests>=3.21.3",
    "qh3>=2.1.0",
    "urllib3-future>=2.25.905",
]

[project.urls]
Homepage = "https://polarsen-io.github.io/padwan-ai"
Source = "https://github.com/polarsen-io/padwan-ai"
Changelog = "https://github.com/polarsen-io/padwan-ai/blob/master/CHANGELOG.md"

[project.optional-dependencies]
langfuse = ["langfuse>=4.9", "opentelemetry-api>=1.44"]
otel = ["opentelemetry-api>=1.44"]
realtime = ["niquests[ws]>=3.21.3"]

[project.scripts]
padwan-ai = "padwan_ai.__main__:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.13.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "padwan_ai"


[dependency-groups]
dev = [
    "msgspec>=0.22.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "prek>=0.5.9",
    "pydantic>=2.14.2",
    "beautifulsoup4>=4.15.0",  # tests/test_docs_preview.py
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.3",
]
llms = [
    "anthropic>=2.3.0",
    "elevenlabs>=2.75.0",
    "google-genai>=2.34.0",
    "gradium>=0.6.4",
    "mcp>=2.3.0",
    "openai>=3.42.0",
    # grpcio (via xai-sdk) has no 3.15 wheels yet and segfaults when built from source
    "xai-sdk>=1.21.0; python_version < '3.15'",
]
research = [
    "jupyter>=1.1.1",
    "pandas>=3.1.0",
    "python-dotenv>=1.2.4",
]
docs = [
    "zensical>=0.0.74",
]

[tool.ruff.lint]
# Pin the pre-ruff-0.16 default rule set; adopting the expanded defaults
# (BLE, SIM, S, TC, ...) is a separate cleanup.
select = ["E4", "E7", "E9", "F", "G", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
# Without include, pyright walks SDK source via imports and OOMs.
include = ["padwan_ai", "tests"]
# bin/ holds PEP 723 inline scripts with their own dep envs.
exclude = ["bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=padwan_ai --cov-report=term-missing -m 'not e2e'"
markers = [
    "e2e: end-to-end tests requiring real API keys",
    "paid: e2e tests that spend provider credits or create resources (opt in with -m 'e2e and paid')",
    "otel_expect_error: test whose spans are expected to end in ERROR status under --otel",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
update_changelog_on_bump = true
bump_message = "chore(release): release $current_version → $new_version [skip ci]"

[tool.coverage.run]
source = ["padwan_ai"]
omit = ["padwan_ai/__init__.py", "padwan_ai/*/types.py"]
