[project]
name = "padwan-llm"
version = "0.11.0"
description = "Renamed to padwan-ai. Installing this package pulls in padwan-ai."
readme = "README.md"
authors = [{ email = "julien.brayere@polarsen.io" }]
requires-python = ">=3.13"
dependencies = ["padwan-ai"]

[project.urls]
Repository = "https://github.com/polarsen-io/padwan-ai"

[build-system]
requires = ["uv_build>=0.13.7,<0.13.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "padwan_llm"
