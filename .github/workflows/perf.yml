name: Performance

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:

permissions:
  contents: write
  pull-requests: write

env:
  PYTHON_VERSIONS: "3.13 3.15"

jobs:
  benchmark:
    name: Import time benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      # One JSON for every version, so the action posts a single table
      - name: Run benchmarks
        run: |
          for v in $PYTHON_VERSIONS; do
            export UV_PYTHON="$v"
            uv sync --all-extras --all-groups --frozen
            ./bin/bench-imports.sh --json --label "$v" > "bench-$v.json"
          done
          jq -s 'add | sort_by(.name)' bench-*.json > benchmark-results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@d48d326b4ca9ba73ca0cd0d59f108f9e02a381c7 # v1.20.4
        with:
          name: Import Performance
          tool: customSmallerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Comment on PR with diff vs base branch (fork PRs have a read-only token)
          comment-on-alert: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          comment-always: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
          summary-always: true
          # Fail if 20% slower than previous; values are runner-speed normalised
          alert-threshold: "120%"
          fail-on-alert: true
          # Store results in gh-pages branch (only on master)
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
