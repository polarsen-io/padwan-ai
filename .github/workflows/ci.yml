name: CI

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --all-groups --no-group research

      - name: Running lint check
        run: uv run ruff check .

      - name: Check format
        run: uv run ruff format --check .

      - name: Running type checking
        run: uv run pyright
        env:
          PYRIGHT_PYTHON_GLOBAL_NODE: true

      - name: Run tests
        run: uv run pytest -vv --junitxml=tests/junit.xml

      - name: Generating coverage
        run: |
          uv run coverage xml -o tests/coverage.xml
          uv run coverage html

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html-${{ matrix.python-version }}
          path: htmlcov
