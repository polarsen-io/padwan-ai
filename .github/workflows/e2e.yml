name: E2E

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.label.name == 'e2e'
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - id: files
        run: echo "files=$(ls tests/e2e/test_*.py | grep -v test_vllm.py | jq -Rsc 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E (${{ matrix.file }})
    needs: collect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.collect.outputs.files) }}
    # Secrets live in this environment, gated by a required reviewer
    environment: e2e
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run end-to-end tests
        run: uv run pytest ${{ matrix.file }} -m e2e -vv

  e2e-vllm:
    name: E2E (tests/e2e/test_vllm.py)
    needs: collect
    # needs a reachable vLLM server; shown as skipped until the repo variable is set
    if: vars.VLLM_BASE_URL != ''
    runs-on: ubuntu-latest
    env:
      VLLM_BASE_URL: ${{ vars.VLLM_BASE_URL }}
      VLLM_MODEL: ${{ vars.VLLM_MODEL }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run end-to-end tests
        run: uv run pytest tests/e2e/test_vllm.py -m e2e -vv
